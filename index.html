<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Chitro mart bd | প্রিমিয়াম লাইফস্টাইল ও ফ্যাশন ই-কমার্স</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #090d16;
            --secondary-dark: #131b2e;
            --card-dark: #1e293b;
            --gold-accent: #f59e0b;
            --gold-light: #fbbf24;
            --gold-dark: #d97706;
            --bg-light: #f1f5f9;
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --wa-color: #25D366;
            --fb-color: #1877F2;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* উপরের ঘোষণা বার */
        .announcement-bar {
            background: linear-gradient(90deg, #020617, #1e293b, #020617);
            color: #f8fafc;
            text-align: center;
            padding: 9px 15px;
            font-size: 13.5px;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
        }
        .announcement-bar span {
            color: var(--gold-light);
            font-weight: 700;
        }

        /* মেইন নেভিগেশন হেডার */
        header {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }
        .brand-logo span {
            color: var(--gold-accent);
        }

        .search-wrapper {
            flex: 1;
            max-width: 520px;
            display: flex;
            background: var(--white);
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 0 0 2px transparent;
            transition: 0.25s;
        }
        .search-wrapper:focus-within {
            box-shadow: 0 0 0 3px var(--gold-accent);
        }
        .search-wrapper input {
            flex: 1;
            border: none;
            padding: 9px 18px;
            border-radius: 50px;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
        }
        .search-wrapper button {
            background: linear-gradient(135deg, var(--gold-accent), var(--gold-dark));
            color: #000;
            border: none;
            padding: 9px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-wrapper button:hover {
            filter: brightness(1.1);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--secondary-dark);
            color: var(--white);
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            position: relative;
        }
        .icon-btn:hover {
            border-color: var(--gold-accent);
            color: var(--gold-light);
        }
        .badge-count {
            background: var(--gold-accent);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 50px;
        }
        /* প্রিমিয়াম হিরো ব্যানার */
        .hero-banner {
            background: radial-gradient(circle at 80% 20%, #1e293b 0%, #090d16 70%);
            color: var(--white);
            padding: 75px 5% 95px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-pill {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold-light);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .hero-banner h1 {
            font-size: 44px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 14px;
        }
        .hero-banner h1 span {
            color: var(--gold-accent);
        }
        .hero-banner p {
            font-size: 18px;
            color: #cbd5e1;
            max-width: 650px;
            margin: 0 auto 28px;
        }
        .hero-cta-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-accent), var(--gold-dark));
            color: #000;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: 0.25s;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: 0.25s;
        }
        .btn-outline:hover {
            border-color: var(--gold-accent);
            color: var(--gold-light);
        }

        /* বিশ্বাসযোগ্যতা কার্ড বার */
        .trust-section {
            max-width: 1220px;
            margin: -42px auto 40px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 18px;
            position: relative;
            z-index: 10;
        }
        .trust-box {
            background: var(--white);
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border-color);
        }
        .trust-icon {
            font-size: 30px;
            background: #fef3c7;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        .trust-info h4 {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--text-main);
        }
        .trust-info p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* মেইন কন্টেইনার ও অ্যাডমিন প্যানেল */
        .main-wrapper {
            max-width: 1220px;
            width: 100%;
            margin: 0 auto 60px;
            padding: 0 20px;
            flex: 1;
        }

        .admin-dashboard {
            display: none;
            background: var(--white);
            border: 2px solid var(--gold-accent);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-lg);
        }
        .admin-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-top-bar h3 {
            font-size: 22px;
            color: var(--primary-dark);
        }
        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--gold-accent);
            background: var(--white);
        }
        .btn-publish {
            grid-column: 1 / -1;
            background: var(--primary-dark);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-publish:hover {
            background: var(--gold-accent);
            color: #000;
        }
        /* ফিল্টার ও সর্টিং বার */
        .shop-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }
        .category-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pill-btn {
            background: var(--white);
            border: 1px solid #cbd5e1;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .pill-btn.active, .pill-btn:hover {
            background: var(--primary-dark);
            color: var(--white);
            border-color: var(--primary-dark);
        }
        .sort-select {
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #cbd5e1;
            background: var(--white);
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        /* প্রোডাক্ট কার্ড গ্রিড */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--gold-accent);
        }
        .card-badges {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
        }
        .badge-offer {
            background: var(--danger);
            color: var(--white);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
        }
        .wish-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
        }
        .wish-btn.active {
            color: var(--danger);
            border-color: var(--danger);
        }
        .admin-del-btn {
            position: absolute;
            top: 54px;
            right: 12px;
            background: var(--danger);
            color: var(--white);
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            z-index: 6;
        }
        .img-container {
            width: 100%;
            height: 270px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.35s ease;
        }
        .product-card:hover .img-container img {
            transform: scale(1.06);
        }
        .card-details {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-category {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        .card-name {
            font-size: 18.5px;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 5px 0 8px;
            cursor: pointer;
            line-height: 1.35;
        }
        .card-name:hover {
            color: var(--gold-dark);
        }
        .price-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }
        .current-price {
            font-size: 23px;
            font-weight: 700;
            color: #b91c1c;
        }
        .old-price {
            font-size: 15px;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 9px;
        }
        .btn-cart {
            background: #f1f5f9;
            color: var(--primary-dark);
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-cart:hover {
            background: #e2e8f0;
        }
        .btn-order-now {
            background: var(--primary-dark);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-order-now:hover {
            background: var(--gold-accent);
            color: #000;
        }

        /* খালি স্টোর বক্স */
        .empty-store {
            background: var(--white);
            border: 2px dashed #cbd5e1;
            border-radius: 18px;
            padding: 70px 25px;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* পপ-আপ মডাল এবং সাইড কার্ট */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-dialog {
            background: var(--white);
            max-width: 780px;
            width: 100%;
            border-radius: 18px;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal-btn {
            position: absolute;
            right: 20px;
            top: 14px;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--white);
            z-index: 2500;
            box-shadow: -10px 0 30px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open {
            right: 0;
        }
        .cart-header {
            background: var(--primary-dark);
            color: var(--white);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }
        .cart-footer {
            padding: 18px;
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
        }

        /* কন্টাক্ট ও ফুটার */
        .contact-section {
            background: var(--white);
            border-top: 1px solid var(--border-color);
            padding: 55px 20px;
            text-align: center;
        }
        .contact-section h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 24px;
        }
        .social-links-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 50px;
            color: var(--white);
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            transition: 0.25s;
        }
        .social-pill.wa {
            background: var(--wa-color);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }
        .social-pill.fb {
            background: var(--fb-color);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.35);
        }
        .social-pill:hover {
            transform: translateY(-3px);
        }

        .back-top-bar {
            background: var(--secondary-dark);
            color: var(--white);
            text-align: center;
            padding: 14px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
        }
        footer {
            background: var(--primary-dark);
            color: #94a3b8;
            text-align: center;
            padding: 24px 15px;
            font-size: 14px;
        }

    <script>
        let storeProducts = JSON.parse(localStorage.getItem('chitro_store_v2')) || [];
        let shoppingCart = JSON.parse(localStorage.getItem('chitro_cart_v2')) || [];
        let wishlist = JSON.parse(localStorage.getItem('chitro_wish_v2')) || [];
        let activeCategory = 'সব';
        let isAdminLogged = sessionStorage.getItem('chitro_admin_logged') === 'true';
        let uploadedBase64 = '';

        if (isAdminLogged) {
            document.getElementById('adminDashboard').style.display = 'block';
        }

        function openLoginBox() {
            if (isAdminLogged) {
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('adminDashboard').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('passInput').focus();
        }

        function closeLoginBox() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function verifyAdmin() {
            const val = document.getElementById('passInput').value;
            if (val === 'chitro2026') {
                isAdminLogged = true;
                sessionStorage.setItem('chitro_admin_logged', 'true');
                closeLoginBox();
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('adminDashboard').scrollIntoView({ behavior: 'smooth' });
                applyFilters();
            } else {
                alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন: chitro2026');
            }
        }

        function logoutAdmin() {
            isAdminLogged = false;
            sessionStorage.removeItem('chitro_admin_logged');
            document.getElementById('adminDashboard').style.display = 'none';
            applyFilters();
        }

        // ছবি অটোমেটিক রিসাইজ ও কম্প্রেস করে সেভ করার ফাংশন
        function processImage(input) {
            if (!input.files || !input.files) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 600;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    uploadedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files);
        }

        function publishProduct() {
            const name = document.getElementById('prodName').value.trim();
            const cat = document.getElementById('prodCat').value;
            const price = Number(document.getElementById('prodPrice').value);
            const oldPrice = Number(document.getElementById('prodOldPrice').value) || 0;
            const img = uploadedBase64 || document.getElementById('prodImgLink').value.trim();
            const sizes = document.getElementById('prodSizes').value.trim();
            const details = document.getElementById('prodDetails').value.trim() || '১০০% প্রিমিয়াম ও এক্সপোর্ট কোয়ালিটি পণ্য।';

            if (!name || !price || !img) {
                alert('অনুগ্রহ করে প্রোডাক্টের নাম, বর্তমান দাম এবং ছবি দিন!');
                return;
            }

            const newItem = { id: Date.now(), name, cat, price, oldPrice, img, sizes, details };
            storeProducts.unshift(newItem);
            localStorage.setItem('chitro_store_v2', JSON.stringify(storeProducts));

            uploadedBase64 = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodOldPrice').value = '';
            document.getElementById('prodFile').value = '';
            document.getElementById('prodImgLink').value = '';
            document.getElementById('prodSizes').value = '';
            document.getElementById('prodDetails').value = '';

            applyFilters();
            alert('অভিনন্দন! আপনার প্রোডাক্টটি সফলভাবে যুক্ত হয়েছে।');
        }

        function removeProduct(id) {
            if (!confirm('আপনি কি নিশ্চিত এই প্রোডাক্টটি ডিলিট করতে চান?')) return;
            storeProducts = storeProducts.filter(p => p.id !== id);
            localStorage.setItem('chitro_store_v2', JSON.stringify(storeProducts));
            applyFilters();
        }

        function toggleWish(id) {
            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(x => x !== id);
            } else {
                wishlist.push(id);
            }
            localStorage.setItem('chitro_wish_v2', JSON.stringify(wishlist));
            applyFilters();
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortType = document.getElementById('sortSelect').value;

            let filtered = storeProducts.filter(p => {
                const matchCat = activeCategory === 'সব' || p.cat === activeCategory;
                const matchText = p.name.toLowerCase().includes(query) || p.details.toLowerCase().includes(query);
                return matchCat && matchText;
            });

            if (sortType === 'low') filtered.sort((a, b) => a.price - b.price);
            if (sortType === 'high') filtered.sort((a, b) => b.price - a.price);

            renderProducts(filtered);
        }

        function renderProducts(list) {
            const grid = document.getElementById('productGrid');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="empty-store">
                        <div style="font-size:52px;margin-bottom:12px;">🛍️</div>
                        <h3 style="font-size:24px;margin-bottom:8px;">আমাদের নতুন কালেকশন সাজানো হচ্ছে</h3>
                        <p style="color:var(--text-muted);font-size:16px;">খুব শীঘ্রই প্রিমিয়াম সব পণ্য এখানে যুক্ত করা হবে।</p>
                    </div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const discount = p.oldPrice > p.price ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
                const isWished = wishlist.includes(p.id);
                return `
                    <div class="product-card">
                        <div class="card-badges">
                            ${discount > 0 ? `<span class="badge-offer">${discount}% ছাড়</span>` : ''}
                        </div>
                        <button type="button" class="wish-btn ${isWished ? 'active' : ''}" onclick="toggleWish(${p.id})">
                            ${isWished ? '❤️' : '🤍'}
                        </button>
                        ${isAdminLogged ? `<button type="button" class="admin-del-btn" onclick="removeProduct(${p.id})">ডিলিট ✕</button>` : ''}
                        <div>
                            <div class="img-container" onclick="openProductModal(${p.id})">
                                <img src="${p.img}" referrerpolicy="no-referrer" alt="${p.name}" onerror="this.src='https://placehold.co'">
                            </div>
                            <div class="card-details">
                                <div>
                                    <div class="card-category">${p.cat}</div>
                                    <h3 class="card-name" onclick="openProductModal(${p.id})">${p.name}</h3>
                                    <div class="price-group">
                                        <span class="current-price">৳${p.price}</span>
                                        ${p.oldPrice > p.price ? `<span class="old-price">৳${p.oldPrice}</span>` : ''}
                                    </div>
                                </div>
                                <div class="action-buttons">
                                    <button type="button" class="btn-cart" onclick="addToCart(${p.id})">+ কার্ট</button>
                                    <button type="button" class="btn-order-now" onclick="openProductModal(${p.id})">অর্ডার করুন</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function openProductModal(id) {
            const p = storeProducts.find(item => item.id === id);
            if (!p) return;
            const sizeArr = p.sizes ? p.sizes.split(',').map(s => s.trim()).filter(Boolean) : [];
            const sizeHtml = sizeArr.length > 0 ? `
                <select id="orderSize" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;">
                    ${sizeArr.map(s => `<option value="${s}">সাইজ: ${s}</option>`).join('')}
                </select>` : '';

            document.getElementById('productModalBody').innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:10px;">
                    <div style="border:1px solid #e2e8f0;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;">
