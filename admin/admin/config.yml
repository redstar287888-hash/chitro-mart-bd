backend:
  name: github
  repo: redstar287888-hash/chitro-mart-bd
  branch: main
  base_url: https://chitro-mart-bd.pages.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "products"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Price (TK)", name: "price", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["fashion", "threepiece", "gadget", "watch", "accessories"] }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "desc", widget: "text" }
